name: Publish image
on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.registry.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
      - id: registry
        name: Check registry configuration and image tags
        env:
          REGISTRY: ${{ vars.CI_REGISTRY }}
          IMAGE: ${{ vars.CI_REGISTRY_IMAGE }}
          USERNAME: ${{ secrets.CI_REGISTRY_USER }}
          PASSWORD: ${{ secrets.CI_REGISTRY_PASSWORD }}
        run: |
          if [ -z "$REGISTRY" ] || [ -z "$IMAGE" ] || [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Image publish skipped. Configure CI_REGISTRY and CI_REGISTRY_IMAGE variables plus CI_REGISTRY_USER and CI_REGISTRY_PASSWORD secrets."
            exit 0
          fi
          {
            echo "enabled=true"
            echo "tags<<EOF"
            printf '%s:%s\n' "$IMAGE" "$GITHUB_SHA"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              printf '%s:%s\n' "$IMAGE" "$GITHUB_REF_NAME"
            else
              printf '%s:latest\n' "$IMAGE"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
        if: steps.registry.outputs.enabled == 'true'
      - uses: docker/login-action@v4
        if: steps.registry.outputs.enabled == 'true'
        with:
          registry: ${{ vars.CI_REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v7
        if: steps.registry.outputs.enabled == 'true'
        with:
          context: .
          push: true
          tags: ${{ steps.registry.outputs.tags }}
