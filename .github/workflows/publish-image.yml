name: Publish image
on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/azure-night-llc/monogame-image
    steps:
      - uses: actions/checkout@v7
      - id: tags
        name: Prepare image tags
        run: |
          {
            echo "tags<<EOF"
            printf '%s:%s\n' "$IMAGE_NAME" "$GITHUB_SHA"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              printf '%s:%s\n' "$IMAGE_NAME" "$GITHUB_REF_NAME"
            else
              printf '%s:latest\n' "$IMAGE_NAME"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
